<form (ngSubmit)="onSubmit()" #productForm="ngForm">
  <div class="form-group">
    <label for="productName">Product Name</label>
    <input type="text" id="productName" class="form-control" [(ngModel)]="product.name" name="name" required>
  </div>
  
  <div class="form-group">
    <label for="productDescription">Description</label>
    <textarea id="productDescription" class="form-control" [(ngModel)]="product.description" name="description" required></textarea>
  </div>
  
  <div class="form-group">
    <label for="productPrice">Price</label>
    <input type="number" id="productPrice" class="form-control" [(ngModel)]="product.price" name="price" required>
  </div>
  
  <div class="form-group">
    <label for="productStatus">Status</label>
    <select id="productStatus" class="form-control" [(ngModel)]="product.status" name="status">
      <option value="available">Available</option>
      <option value="sold">Sold</option>
    </select>
  </div>
  
  <button type="submit" class="btn btn-primary">Update Product</button>
  <button type="button" class="btn btn-danger" (click)="onDelete()">Delete Product</button>
</form>

<!--top- nav-->
<nav class="navbar  shadow-sm px-4 py-3 bg-white  ">
    <div class="logo_container navBar ">
        <a href="" routerLink="/">
        <img src="/logo.png" alt="logo" srcset="">
        </a>
    </div>
    <div class="content_container ">
        <!-- Show Sign Up/Login buttons if not logged in -->
        <ng-container *ngIf="!isLoggedIn()">
            <a href="" routerLink="/SignUp"><button class="btn btn-success px-4 py-2 m-2 fw-semibold">Sign Up</button></a> 
            <a href="" routerLink="/SignIn" class=""><button class="btn border-success px-4 py-2 m-2 fw-semibold text-success" >Log In</button></a>
        </ng-container>
        
        <!-- Show user info and logout if logged in -->
        <ng-container *ngIf="isLoggedIn()">
            <span class="user-greeting text-success fw-semibold mx-3">Hello, {{ getUserName() || 'User' }}!</span>
            <button class="btn btn-outline-danger px-3 py-2 m-2 fw-semibold" (click)="logout()">Logout</button>
        </ng-container>
        <span class="input position-relative">
            <input type="text" 
                   [(ngModel)]="searchQuery"
                   (input)="onSearch()"
                   (keyup.enter)="onSearchEnter()"
                   (focus)="onSearchFocus()"
                   (blur)="onSearchBlur()"
                   class="search form-group border-success rounded-pill px-5 py-2 m-2"
                   placeholder="Search brands, categories, products...">
            <svg class="svg" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="#000000">
                <path
                    d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
            </svg>
            
            <!-- Search Results Dropdown -->
            <div class="search-results" *ngIf="showSearchResults">
                <div class="search-loading" *ngIf="isSearching">
                    <i class="fas fa-spinner fa-spin"></i>
                    Searching...
                </div>
                
                <div class="search-items" *ngIf="!isSearching && searchResults.length > 0">
                    <div class="search-item" 
                         *ngFor="let product of searchResults.slice(0, 8)"
                         (click)="selectProduct(product.id)">
                        <div class="product-info">
                            <div class="product-image">
                                <img [src]="product.images?.[0] || 'assets/images/default-product.svg'" 
                                     [alt]="product.description"
                                     onerror="this.src='assets/images/default-product.svg'">
                            </div>
                            <div class="product-details">
                                <h6>{{ product.description }}</h6>
                                <small class="text-muted">{{ product.brand }} | {{ product.items }}</small>
                                <div class="price">Rs. {{ product.price }}</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="no-results" *ngIf="!isSearching && searchResults.length === 0 && searchQuery.trim()">
                    <i class="fas fa-search"></i>
                    No products found for "{{ searchQuery }}"
                </div>
            </div>
        </span>
    </div>
</nav>
<!--bottom nav-->
<div class="navbar nav-bottom row">
    <div class="col-2"></div>
    <div class="nav-links col-6">
        <ul class="nav">
        <li class="nav-item" routerLinkActive="text-primary" [routerLinkActiveOptions]="{exact: true}">
            <a class="nav-link position-relative" 
               routerLink="/" 
               [class.text-dark]="active!=='home'" 
               [class.text-primary]="active==='home'"
               (click)="setActive('home')">
                Home
                <span class="active-indicator" *ngIf="active==='home'"></span>
            </a>
        </li>
            <li class="nav-item">
                <a class="nav-link position-relative" 
                   routerLink="/productWomen" 
                   [class.text-dark]="active!=='women'" 
                   [class.text-primary]="active==='women'"
                   href="#" 
                   (click)="setActive('women')">
                    Women
                    <span class="active-indicator" *ngIf="active==='women'"></span>
                </a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link position-relative" 
                   routerLink="/productMen" 
                   [class.text-dark]="active!=='men'" 
                   [class.text-primary]="active==='men'"
                   href="#" 
                   (click)="setActive('men')">
                    Men
                    <span class="active-indicator" *ngIf="active==='men'"></span>
                </a>
            </li>
          
            <li class="nav-item">
                <a class="nav-link position-relative" 
                   routerLink="/productBrands" 
                   [class.text-dark]="active!=='brands'" 
                   [class.text-primary]="active==='brands'"
                   href="#" 
                   (click)="setActive('brands')">
                    Brands
                    <span class="active-indicator" *ngIf="active==='brands'"></span>
                </a>
            </li>
        </ul>
    </div>
     <div class="user-actions d-flex justify-content-end col-4 align-items-center ">
        <button class="border-0 bg-transparent" 
            (click)="navigateToDashboard()"
            *ngIf="isLoggedIn() && (getUserRole() === 'seller' || getUserRole() === 'admin')"
            title="Go to Dashboard">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000">
            <path d="M520-600v-240h320v240H520ZM120-440v-400h320v400H120Zm400 320v-400h320v400H520Zm-400 0v-240h320v240H120Zm80-400h160v-240H200v240Zm400 320h160v-240H600v240Zm0-480h160v-80H600v80ZM200-200h160v-80H200v80Zm160-320Zm240-160Zm0 240ZM360-280Z"/>
            </svg>
        </button>
            <button class="border-0 bg-transparent cart-btn position-relative" routerLink="/cart" title="Shopping Cart">
                <svg class="m-2" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#000000">
                    <path
                        d="M280-80q-33 0-56.5-23.5T200-160q0-33 23.5-56.5T280-240q33 0 56.5 23.5T360-160q0 33-23.5 56.5T280-80Zm400 0q-33 0-56.5-23.5T600-160q0-33 23.5-56.5T680-240q33 0 56.5 23.5T760-160q0 33-23.5 56.5T680-80ZM208-800h590q23 0 35 20.5t1 41.5L692-482q-11 20-29.5 31T622-440H324l-44 80h480v80H280q-45 0-68-39.5t-2-78.5l54-98-144-304H40v-80h130l38 80Z" />
                </svg>
                <span class="cart-badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
            </button>
            
        <a href="" routerLink="/seller" *ngIf="!isLoggedIn() || getUserRole() === 'seller' || getUserRole() === 'user' || getUserRole() === 'customer'"><button class="btn btn-warning px-4 py-2   me-1 fw-medium  ">Sell Now</button></a>
    </div>

</div>
